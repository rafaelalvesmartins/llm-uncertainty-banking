<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">lub benchmark pipeline — dataset to regulatory evidence</title>
  <desc id="desc">Top-down flow showing how a dataset becomes machine-readable regulatory evidence: Dataset, BenchmarkRunner, Calibration metrics, BenchmarkResult, FindingClassifier, SR 11-7 mapping, output reports, auditor.</desc>

  <style>
    .h2 { font-size: 14px; font-weight: 700; fill: #1c1917; }
    .h3 { font-size: 11px; font-weight: 600; fill: #1c1917; }
    .body { font-size: 11px; fill: #44403c; }
    .small { font-size: 10px; fill: #78716c; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #44403c; }
    .ds { fill: #cffafe; stroke: #06b6d4; stroke-width: 1; }
    .runner { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1; }
    .cal { fill: #d1fae5; stroke: #10b981; stroke-width: 1; }
    .res { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1; }
    .find { fill: #ffedd5; stroke: #f97316; stroke-width: 1; }
    .sr { fill: #fae8ff; stroke: #c026d3; stroke-width: 1; }
    .out { fill: #fee2e2; stroke: #ef4444; stroke-width: 1; }
    .auditor { fill: #166534; stroke: #14532d; stroke-width: 1.5; }
    .arrow { stroke: #44403c; stroke-width: 1.5; fill: none; }
    .lbl { font-size: 10px; fill: #78716c; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#44403c"/>
    </marker>
  </defs>

  <text x="440" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1917">benchmark pipeline — dataset → regulatory evidence</text>

  <rect x="280" y="50" width="320" height="64" rx="8" class="ds"/>
  <text x="440" y="70" text-anchor="middle" class="h2">Dataset</text>
  <text x="440" y="86" text-anchor="middle" class="small">BR-Regulatory (20 QA, banking) · FinQA · ConvFinQA · Credit Scoring</text>
  <text x="440" y="103" text-anchor="middle" class="mono">load() → list[Example]</text>

  <rect x="280" y="150" width="320" height="78" rx="8" class="runner"/>
  <text x="440" y="170" text-anchor="middle" class="h2">BenchmarkRunner</text>
  <text x="290" y="190" class="small">→ iterate examples · pipeline.answer(question)</text>
  <text x="290" y="206" class="small">→ exact_match(pred, gold) · collect confidences</text>
  <text x="290" y="222" class="mono">→ numpy arrays (confs, correct)</text>

  <rect x="280" y="260" width="320" height="86" rx="8" class="cal"/>
  <text x="440" y="280" text-anchor="middle" class="h2">lub.calibration.compute_all</text>
  <text x="440" y="298" text-anchor="middle" class="small">14 metrics in one pass:</text>
  <text x="440" y="314" text-anchor="middle" class="mono">ECE · Brier · refusal_AUROC · PRR</text>
  <text x="440" y="328" text-anchor="middle" class="mono">CRPS · NLL · spearman · sharpness · …</text>

  <rect x="280" y="378" width="320" height="78" rx="8" class="res"/>
  <text x="440" y="398" text-anchor="middle" class="h2">BenchmarkResult</text>
  <text x="290" y="418" class="small">all metrics · git_sha · package_versions</text>
  <text x="290" y="434" class="small">dataset_hash · timestamp · provenance JSON-LD</text>
  <text x="290" y="450" class="mono">→ reproducible artifact</text>

  <rect x="40" y="490" width="380" height="86" rx="8" class="find"/>
  <text x="230" y="510" text-anchor="middle" class="h2">FindingClassifier (OCC 2011-12)</text>
  <text x="230" y="528" text-anchor="middle" class="small">each metric vs supervisory threshold</text>
  <text x="60" y="548" class="mono" fill="#16a34a">PASS</text>
  <text x="100" y="548" class="small">if metric within bound</text>
  <text x="60" y="562" class="mono" fill="#f97316">OBSERVATION</text>
  <text x="160" y="562" class="small">if borderline</text>
  <text x="60" y="576" class="mono" fill="#dc2626">FINDING</text>
  <text x="160" y="576" class="small">if breach (escalation needed)</text>

  <rect x="460" y="490" width="380" height="86" rx="8" class="sr"/>
  <text x="650" y="510" text-anchor="middle" class="h2">SR 11-7 / OCC 2011-12 mapping</text>
  <text x="480" y="530" class="small">Pillar 2 — Model Validation:</text>
  <text x="480" y="546" class="mono">V.A conceptual · V.B outcomes · V.C benchmarking</text>
  <text x="480" y="562" class="small">Pillar 3 — Governance:</text>
  <text x="480" y="578" class="mono">VI.A docs · VI.B monitoring · VI.C change mgmt</text>

  <rect x="180" y="610" width="520" height="60" rx="8" class="out"/>
  <text x="440" y="630" text-anchor="middle" class="h2">L5 reports — machine-readable evidence bundle</text>
  <text x="440" y="650" text-anchor="middle" class="mono">AI-RMF HTML · OSCAL Component Definition (JSON) · OSCAL Assessment Results · Giskard scan</text>
  <text x="440" y="664" text-anchor="middle" class="small">consumed by MRM auditor / OCC examiner</text>

  <path d="M 440 114 L 440 150" class="arrow" marker-end="url(#ah)"/>
  <path d="M 440 228 L 440 260" class="arrow" marker-end="url(#ah)"/>
  <path d="M 440 346 L 440 378" class="arrow" marker-end="url(#ah)"/>
  <path d="M 380 456 Q 280 480 230 490" class="arrow" marker-end="url(#ah)"/>
  <path d="M 500 456 Q 600 480 650 490" class="arrow" marker-end="url(#ah)"/>
  <path d="M 230 576 Q 280 600 320 610" class="arrow" marker-end="url(#ah)"/>
  <path d="M 650 576 Q 600 600 560 610" class="arrow" marker-end="url(#ah)"/>

  <text x="40" y="700" class="small">Every artifact carries `git_sha + dataset_hash + package_versions` so a counterparty can re-run and replicate the exact numbers.</text>
</svg>
