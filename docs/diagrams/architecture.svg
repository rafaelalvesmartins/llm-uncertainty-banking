  <text x="40" y="710" class="small">Apache 2.0 - Import direction enforced by import-linter - v0.1 frozen surface (732 tests / 93% / 86 mod / 22 estimators / 14 metrics / 6 regimes) - ruflo as orch core per ADR-002 (pass 30, 2026-04-26)</text>
