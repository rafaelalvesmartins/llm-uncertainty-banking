# REFERENCE artifact — Track D scale topology (ENGINEERING_HARDENING_PLAN.md §D.5).
# ⚠️  REQUIRES the stateless adapter wiring described in SCALE_WIRING.md FIRST.
#     Running app with deploy.replicas > 1 before that is done will cause each
#     replica to hold its own diverging copy of _AUDIT, _CACHE, and _RATE_LIMITER.
#     The result is wrong audit chains, stale cache hits, and per-replica metrics.
#     Keep replicas: 1 (or don't use this file at all) until SCALE_WIRING.md is
#     signed off.
#
# Style mirrors reference/docker-compose.yml (the lub gateway reference).
# Run from the bridge-ui/ directory:
#   docker compose -f deploy/docker-compose.scale.yml up
#
# Required env (copy .env.example and fill in):
#   POSTGRES_PASSWORD   — strong password for the bridge Postgres user
#   GRAFANA_PASSWORD    — Grafana admin password

services:

  # --------------------------------------------------------------------------
  # lb — nginx reverse proxy, round-robin → app
  # --------------------------------------------------------------------------
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # app — FastAPI backend (stateless once SCALE_WIRING.md is complete)
  # --------------------------------------------------------------------------
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # ⚠️  Keep replicas: 1 until SCALE_WIRING.md is signed off.
    #     Bump to 3 only after Redis cache/limiter + Postgres audit are wired.
    deploy:
      replicas: 3
    environment:
      # Postgres audit store (Track D / D.1) — see scale/audit_postgres.py
      DATABASE_URL: "postgresql://bridge:${POSTGRES_PASSWORD}@db:5432/bridge"
      # Redis cache, rate-limiter, idempotency (Track D / D.1) — see scale/cache_redis.py
      #   scale/limiter_redis.py, and scale/idempotency_redis.py
      REDIS_URL: "redis://cache:6379/0"
      # Auth gate — set to "on" only after Track C (C1→C3) is complete.
      # The demo path (BRIDGE_AUTH=off) keeps working at all times.
      BRIDGE_AUTH: "on"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped
    # No ports exposed directly — all traffic enters through lb.

  # --------------------------------------------------------------------------
  # db — Postgres 16 (audit + durable state)
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: bridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # cache — Redis 7 (semantic cache / rate-limiter / idempotency)
  # --------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    # allkeys-lru: Redis evicts the least-recently-used key when memory is full.
    # This is correct for the semantic cache (stale cache entries should give way
    # to new ones) and for the idempotency cache (TTL handles expiry; LRU handles
    # overflow).  The rate-limiter keys are small and short-lived, so LRU is safe
    # for those too.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # prometheus — scrapes app:8000/metrics (requires routers/observability.py)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # grafana — SLO dashboards (mirrors reference/docker-compose.yml style)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-bridge}"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # LLM serving tier — NOT included here; see ENGINEERING_HARDENING_PLAN.md §D.3.
  # vLLM/TGI (multi-GPU continuous batching) or a managed API sits BEHIND `app`
  # and is addressed via OLLAMA_URL / LUB_BACKEND env vars on the app service.
  # Add it as a separate compose service or external endpoint when ready.
  # --------------------------------------------------------------------------

volumes:
  pgdata:
  redisdata:
  grafanadata:
