# REFERENCE artifact — Track D scale deployment (ENGINEERING_HARDENING_PLAN.md §D.5).
# ⚠️  Do NOT use with >1 app replica until the stateless wiring in SCALE_WIRING.md
#     is complete.  Round-robin across stateful replicas diverges in-process state.

upstream bridge_app {
    # Docker Compose service name "app" resolves to all replica IPs via the
    # embedded DNS.  With deploy.replicas: 3 in docker-compose.scale.yml this
    # gives round-robin across the three workers automatically.
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Forward real client IP so uvicorn/FastAPI can log it and rate-limit per IP.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header Host            $http_host;

    # Disable nginx buffering so SSE / streaming responses pass through
    # immediately (the /query endpoint can stream tokens from the LLM tier).
    proxy_buffering     off;
    proxy_read_timeout  120s;

    location / {
        proxy_pass         http://bridge_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # Health probe — nginx itself (used by monitoring, not app health).
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
