[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llm-uncertainty-banking"
version = "0.1.0"
description = "Uncertainty quantification and NIST AI RMF-aligned reporting for LLMs in regulated banking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Rafael Martins Alves" },
]
keywords = [
    "llm",
    "uncertainty",
    "calibration",
    "conformal-prediction",
    "nist-ai-rmf",
    "banking",
    "model-risk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "transformers>=4.40",
    "torch>=2.2",
    "datasets>=2.18",
    "jinja2>=3.1",
    "typer>=0.12,<0.24",
    "click<8.2",
    "structlog>=24.1",
    "tenacity>=8.2",
    "matplotlib>=3.8",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
vllm = ["vllm>=0.4"]
nli = ["sentence-transformers>=2.7"]
lmpolygraph = ["lm-polygraph>=0.6"]
mcp = ["mcp>=1.0"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "nbformat>=5.10",
]

[project.scripts]
lub = "lub.cli:app"
lub-mcp-server = "lub.mcp.server:run_stdio"
lub-dashboard = "lub.dashboard.cli:main"

[project.urls]
Homepage = "https://github.com/rafaelmartinsalves/llm-uncertainty-banking"
Documentation = "https://rafaelmartinsalves.github.io/llm-uncertainty-banking"
Issues = "https://github.com/rafaelmartinsalves/llm-uncertainty-banking/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lub"]
artifacts = ["src/lub/benchmarks/data/*.jsonl", "src/lub/benchmarks/data/*.md", "src/lub/reports/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"src/lub/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services or large models",
    "real_backend: hits a live LLM provider (opt-in; set LUB_REAL_BACKEND_TESTS=1 to enable)",
]

[tool.coverage.run]
source = ["src/lub"]
branch = true
omit = [
    "src/lub/wrappers/hf.py",
    "src/lub/wrappers/openai.py",
    "src/lub/wrappers/anthropic.py",
    "src/lub/wrappers/vllm.py",
    "src/lub/uncertainty/monte_carlo_dropout.py",
    "src/lub/benchmarks/finqa.py",
    "src/lub/benchmarks/convfinqa.py",
    "src/lub/benchmarks/tatqa.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_package = "lub"

[[tool.importlinter.contracts]]
name = "Layered architecture: wrappers < uncertainty < calibration < benchmarks < reports"
type = "layers"
layers = [
    "lub.reports",
    "lub.benchmarks",
    "lub.calibration",
    "lub.uncertainty",
    "lub.wrappers",
]
ignore_imports = [
    "lub.pipeline -> lub.*",
    "lub.cli.* -> lub.*",
    "lub.guard -> lub.*",
    "lub.telemetry -> lub.*",
    "lub.protocols -> lub.*",
]

[[tool.importlinter.contracts]]
name = "Trust layer (rails/policies/guard) must not leak into core layers"
type = "forbidden"
source_modules = [
    "lub.wrappers",
    "lub.uncertainty",
    "lub.calibration",
    "lub.benchmarks",
    "lub.reports",
]
forbidden_modules = [
    "lub.rails",
    "lub.policies",
    "lub.guard",
    "lub.telemetry",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Orchestration layer must not be imported by core layers"
type = "forbidden"
source_modules = [
    "lub.wrappers",
    "lub.uncertainty",
    "lub.calibration",
    "lub.benchmarks",
    "lub.reports",
]
forbidden_modules = [
    "lub.orchestration",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Governance layer (calibration_targets) must not leak into core layers"
type = "forbidden"
source_modules = [
    "lub.wrappers",
    "lub.uncertainty",
    "lub.calibration",
    "lub.benchmarks",
    "lub.reports",
]
forbidden_modules = [
    "lub.governance",
]
allow_indirect_imports = "true"
