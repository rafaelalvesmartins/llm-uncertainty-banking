# =========================================================================
# Federal Reserve SR 11-7 / OCC 2011-12
# =========================================================================
# Pillar 2 = Model Validation, Pillar 3 = Governance

# -- Pillar 2: Outcomes Analysis --

[sr117.accuracy]
pillar = "Pillar 2"
section = "V.A Outcomes Analysis"
description = "Task accuracy on the evaluation set -- direct evidence for outcomes analysis."

[sr117.refusal_auroc]
pillar = "Pillar 2"
section = "V.A Outcomes Analysis"
description = "AUROC of confidence as a refusal signal -- measures selective prediction quality."

[sr117.prr]
pillar = "Pillar 2"
section = "V.A Outcomes Analysis"
description = "Prediction-rejection ratio vs oracle -- selective prediction effectiveness."

[sr117.aurc]
pillar = "Pillar 2"
section = "V.A Outcomes Analysis"
description = "Area under risk-coverage curve -- selective prediction quality under varying refusal rates."

[sr117.auucc]
pillar = "Pillar 2"
section = "V.A Outcomes Analysis"
description = "Area under uncertainty characteristics curve -- UQ quality metric."

# -- Pillar 2: Conceptual Soundness --

[sr117.ece]
