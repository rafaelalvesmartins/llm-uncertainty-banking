# Metric-to-framework mapping for LUB reports.
#
# Three frameworks: NIST AI RMF 1.0, ISO/IEC 42001:2023, SR 11-7.
# Each metric maps to a sub-category/clause/pillar with a prose description.
# The Python module mapping.py loads this file at import time.

# =========================================================================
# NIST AI RMF 1.0
# =========================================================================

[rmf.accuracy]
subcategory = "MEASURE 2.3"
description = "System performance: task accuracy on the evaluation set."
trust_dimension = "Efficacy"

[rmf.ece]
subcategory = "MEASURE 2.9"
description = "Reliability: expected calibration error of confidence scores."
trust_dimension = "Robustness"

[rmf.refusal_auroc]
subcategory = "MEASURE 2.7"
description = "Safety and robustness: AUROC of confidence as a refusal signal."
trust_dimension = "Robustness"

[rmf.miscalibration_area]
subcategory = "MEASURE 2.9"
description = "Reliability: area between reliability curve and identity diagonal."
trust_dimension = "Robustness"

[rmf.sharpness]
subcategory = "MEASURE 2.9"
description = "Reliability: variance of confidence (decisiveness of the estimator)."
trust_dimension = "Efficacy"

[rmf.missing_ratio]
subcategory = "MEASURE 2.7"
description = "Safety: fraction of examples the system refused to answer."
trust_dimension = "Robustness"

[rmf.prr]
subcategory = "MEASURE 2.7"
description = "Selective prediction: prediction-rejection ratio vs oracle (1.0 = oracle, 0.0 = random)."
trust_dimension = "Robustness"

[rmf.dataset_hash]
subcategory = "MEASURE 2.8"
description = "Transparency: dataset provenance and reproducibility digest."
trust_dimension = "Explainability"

[rmf.dataset_version]
subcategory = "MEASURE 2.8"
description = "Transparency: declared dataset version string (drift diagnosis)."
trust_dimension = "Explainability"

[rmf.git_sha]
subcategory = "MANAGE 4.1"
description = "Change management: code revision under which results were produced."
trust_dimension = "Security"

[rmf.package_versions]
subcategory = "MANAGE 4.1"
description = "Change management: full dependency fingerprint for reproducibility."
trust_dimension = "Security"

[rmf.brier]
subcategory = "MEASURE 2.9"
description = "Reliability: Brier score (mean squared error of confidence forecasts)."
trust_dimension = "Robustness"

[rmf.rmsce]
subcategory = "MEASURE 2.9"
description = "Reliability: root-mean-squared calibration error (L2 analogue of ECE)."
trust_dimension = "Robustness"

[rmf.ence]
subcategory = "MEASURE 2.9"
description = "Reliability: expected normalized calibration error -- penalizes low-confidence miscalibration."
trust_dimension = "Robustness"

[rmf.reversed_pairs_proportion]
subcategory = "MEASURE 2.7"
description = "Safety: fraction of (correct, incorrect) pairs with reversed confidence ordering."
trust_dimension = "Robustness"

[rmf.spearman]
subcategory = "MEASURE 2.5"
description = "Discrimination: Spearman rank correlation between confidence and correctness."
trust_dimension = "Efficacy"

[rmf.kendall_tau]
subcategory = "MEASURE 2.5"
description = "Discrimination: Kendall tau-b rank correlation between confidence and correctness."
trust_dimension = "Efficacy"

[rmf.adversarial_group_calibration]
subcategory = "MEASURE 2.6"
description = "Fairness: worst-case ECE across random subgroups (Zhao et al. 2021)."
trust_dimension = "Bias"

[rmf.aurc]
subcategory = "MEASURE 2.7"
description = "Selective prediction: area under the risk-coverage curve (lower is better)."
trust_dimension = "Robustness"

[rmf.auucc]
subcategory = "MEASURE 2.7"
description = "Selective prediction: area under the uncertainty characteristics curve (higher is better)."
trust_dimension = "Robustness"

[rmf.crps_from_confidence]
subcategory = "MEASURE 2.9"
description = "Scoring rule: CRPS for Bernoulli confidence forecasts (equivalent to Brier)."
trust_dimension = "Robustness"

[rmf.negative_log_likelihood]
subcategory = "MEASURE 2.9"
description = "Scoring rule: binary NLL (log loss) of confidence forecasts."
trust_dimension = "Robustness"


