# Reference deployment — see reference/README.md
# This is DOCUMENTATION, not shipped infrastructure.
# It shows how a bank would integrate lub into its existing stack.

services:
  gateway:
    build:
      context: ..
      dockerfile: reference/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lub:lub@db:5432/lub
      - LUB_ESTIMATOR=self_consistency
      - LUB_THRESHOLD=0.7
      - LUB_BACKEND=dummy
      - LUB_MODEL=dummy-ref
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lub
      POSTGRES_PASSWORD: lub
      POSTGRES_DB: lub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./gateway/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lub"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=lub
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro

volumes:
  pgdata:
